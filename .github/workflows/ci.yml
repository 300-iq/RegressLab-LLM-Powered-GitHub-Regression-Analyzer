name: Build and test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install frontend and contract dependencies
        run: npm ci
      - name: Frontend lint, types, contract tests, unit tests and build
        run: npm run check
      - name: Backend build and real PostgreSQL integration tests
        working-directory: backend
        run: ./gradlew --no-daemon clean test bootJar
      - name: Producer build and correctness check
        run: |
          mvn -B -ntp -f benchmarks/demo/pom.xml package
          java -cp benchmarks/demo/target/test-classes:benchmarks/demo/target/classes dev.regresslab.demo.EventStatisticsTest
      - name: Producer normalization and timeout tests
        run: python3 -m unittest discover -s benchmarks/demo -p 'test_*.py'
      - name: Validate Compose and start PostgreSQL
        run: |
          cp .env.example .env
          printf '\nPOSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)" >> .env
          set -a
          source .env
          set +a
          printf '::add-mask::%s\n' "$POSTGRES_PASSWORD"
          printf 'DATABASE_PASSWORD=%s\n' "$POSTGRES_PASSWORD" >> "$GITHUB_ENV"
          docker compose --env-file .env -f infra/compose.yaml config --quiet
          docker compose --env-file .env -f infra/compose.yaml up -d --wait
      - name: Start the built API and wait for readiness
        run: |
          java -jar backend/build/libs/regresslab-api.jar > /tmp/regresslab-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness; then exit 0; fi
            sleep 1
          done
          cat /tmp/regresslab-api.log
          exit 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile checks against the actual API
        run: E2E_REQUIRE_API=true npm run test:e2e
      - name: Stop PostgreSQL
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose --env-file .env -f infra/compose.yaml down
          fi
